# 在 GitHub 的服务器上打包安卓 APK（只打 arm64）
# 手动打包：仓库页面 → Actions → 打包安卓 APK → Run workflow，完成后在这次运行的页面底部下载
# 发布版本：推送 v 开头的标签（比如 v0.1.0），会自动建一个 Release 并附上 APK
name: 打包安卓 APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # React Native 需要 Java 17
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: 安装依赖
        run: npm ci

      - name: 生成安卓工程
        run: npx expo prebuild --platform android --no-install

      - name: 编译 APK（只打 arm64）
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 给 APK 起名
        run: mv android/app/build/outputs/apk/release/app-release.apk "homework-${{ github.ref_name }}-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: homework-apk
          path: homework-*.apk

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" homework-*.apk --title "${{ github.ref_name }}" --notes "安卓 APK，仅支持 arm64。"
